# Одноразовый: создаёт ключ подписи обновлений официальным инструментом Tauri.
# Ключ шифруется (только Claude может его расшифровать) и кладётся в ветку keygen-out.
# После использования этот файл удаляется.
name: Ключ обновлений (одноразово)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Создать и зашифровать ключ
        run: |
          set -o pipefail
          mkdir -p out
          ( npx --yes @tauri-apps/cli@2 signer generate --ci -p "" -w "$RUNNER_TEMP/spectia.key" ) > out/log.txt 2>&1 || echo "GENERATE FAILED" >> out/log.txt
          if [ -f "$RUNNER_TEMP/spectia.key" ]; then
            openssl cms -encrypt -binary -aes256 -in "$RUNNER_TEMP/spectia.key" -outform PEM -out out/key.enc .github/keygen-recipient.pem
            cp "$RUNNER_TEMP/spectia.key.pub" out/key.pub
            rm -f "$RUNNER_TEMP/spectia.key"
          fi
          sed -i '/^[A-Za-z0-9+\/=]\{80,\}$/d' out/log.txt
      - name: Сохранить в ветку
        run: |
          cd out
          git init -q -b keygen-out
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "encrypted updater key"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" keygen-out

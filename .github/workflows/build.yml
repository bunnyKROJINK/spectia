# Собирает установщик Spectia для Windows.
#
# • Каждый раз, когда в ветку main приходит новый код, GitHub сам собирает .exe.
#   Готовый файл лежит во вкладке Actions → нужная сборка → Artifacts.
# • Выпустить релиз: Actions → «Сборка» → Run workflow → галочка «Выпустить релиз».
#   Текст релиза (и окошка обновления в лаунчере) берётся из RELEASE_NOTES.md.
# • Подробный лог каждой сборки сохраняется в ветку ci-logs (удобно искать ошибки).

name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Выпустить релиз с этой сборкой'
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Установка инструментов
        run: npm install 2>&1 | tee -a ci.log

      - name: Проверка кода на Rust
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee -a ci.log

      - name: Проверка запуска Minecraft (скачивание, Java, запуск)
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml vanilla_end_to_end -- --ignored --nocapture 2>&1 | tee -a ci.log

      - name: Сборка установщика
        run: |
          set -o pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Ключ подписи не задан — собираем без файлов автообновления" | tee -a ci.log
            npm run build -- --config '{"bundle":{"createUpdaterArtifacts":false}}' 2>&1 | tee -a ci.log
          else
            npm run build 2>&1 | tee -a ci.log
          fi

      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: Spectia-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Подготовить релиз
        id: rel
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        run: |
          set -e
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          node .github/latest-json.mjs "$V"
          {
            cat RELEASE_NOTES.md
            echo
            echo "---"
            echo "Скачайте **Spectia_${V}_x64-setup.exe** ниже и запустите его. Если у вас уже стоит Spectia 0.2.0 или новее, лаунчер обновится сам."
            echo
            echo "Если Windows покажет окно «Windows защитила ваш компьютер», нажмите «Подробнее» → «Выполнить в любом случае». Так бывает с любой новой программой без платной цифровой подписи."
          } > release-body.md

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.v }}
          name: Spectia ${{ steps.rel.outputs.v }}
          target_commitish: ${{ github.sha }}
          body_path: release-body.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            latest.json

      - name: Сохранить лог сборки
        if: always()
        run: |
          mkdir -p ci-out && cp ci.log ci-out/ 2>/dev/null || echo "нет лога" > ci-out/ci.log
          cd ci-out
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "лог сборки ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

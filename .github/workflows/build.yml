# Собирает и проверяет Spectia.
#
# • tests   — проверки кода и настоящий запуск Minecraft (на Linux).
# • windows — сборка установщика .exe (Actions → нужная сборка → Artifacts).
# • release — выпуск релиза, только если обе части прошли успешно.
#   Выпустить: Actions → «Сборка» → Run workflow → галочка «Выпустить релиз».
#   Текст релиза (и окошка обновления в лаунчере) берётся из RELEASE_NOTES.md.
# • Подробные логи сохраняются в ветки ci-logs-tests и ci-logs-windows.

name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Выпустить релиз с этой сборкой'
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Системные библиотеки для Tauri
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev > /dev/null

      - name: Проверка кода на Rust
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee -a ci.log

      - name: Проверка запуска Minecraft (скачивание, Java, запуск)
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml vanilla_end_to_end -- --ignored --nocapture 2>&1 | tee -a ci.log

      - name: Сохранить лог
        if: always()
        run: bash .github/push-log.sh ci-logs-tests "${{ github.token }}" "${{ github.repository }}"

  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Установка инструментов
        run: npm install 2>&1 | tee -a ci.log

      - name: Сборка установщика
        run: |
          set -o pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Ключ подписи не задан — собираем без файлов автообновления" | tee -a ci.log
            npm run build -- --config '{"bundle":{"createUpdaterArtifacts":false}}' 2>&1 | tee -a ci.log
          else
            npm run build 2>&1 | tee -a ci.log
          fi

      - name: Подготовить файлы для обновления
        run: node .github/latest-json.mjs "$(node -p "require('./src-tauri/tauri.conf.json').version")" 2>&1 | tee -a ci.log

      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: Spectia-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            latest.json

      - name: Сохранить лог
        if: always()
        run: bash .github/push-log.sh ci-logs-windows "${{ github.token }}" "${{ github.repository }}"

  release:
    needs: [tests, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Spectia-Windows
          path: dist

      - name: Текст релиза
        id: rel
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          {
            cat RELEASE_NOTES.md
            echo
            echo "---"
            echo "Скачайте **Spectia_${V}_x64-setup.exe** ниже и запустите его. Если у вас уже стоит Spectia 0.2.0 или новее, лаунчер обновится сам."
            echo
            echo "Если Windows покажет окно «Windows защитила ваш компьютер», нажмите «Подробнее» → «Выполнить в любом случае». Так бывает с любой новой программой без платной цифровой подписи."
          } > release-body.md
          find dist -type f

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.v }}
          name: Spectia ${{ steps.rel.outputs.v }}
          target_commitish: ${{ github.sha }}
          body_path: release-body.md
          files: |
            dist/**/*.exe
            dist/**/*.sig
            dist/latest.json

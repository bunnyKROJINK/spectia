<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spectia</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <div id="deco" aria-hidden="true"></div>
    <header id="titlebar" class="titlebar" data-tauri-drag-region></header>
    <div class="body">
      <nav id="sidebar" class="sidebar panel"></nav>
      <main id="content" class="content"></main>
    </div>
  </div>
  <div id="overlay"></div>
  <!-- Заставка при запуске: луна и звёзды, пока загружаются сборки -->
  <div id="splash" aria-hidden="true">
    <svg class="splash-moon" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a7 7 0 1 0 9 9 9 9 0 1 1-9-9z"/><path class="splash-spark" d="M17 4l.6 1.4L19 6l-1.4.6L17 8l-.6-1.4L15 6l1.4-.6z"/></svg>
    <span class="splash-name">Spectia</span>
    <i style="left:18%;top:22%"></i><i style="left:78%;top:18%;animation-delay:.15s"></i><i style="left:66%;top:72%;animation-delay:.3s"></i>
    <i style="left:28%;top:70%;animation-delay:.45s"></i><i style="left:88%;top:48%;animation-delay:.2s"></i><i style="left:10%;top:46%;animation-delay:.35s"></i>
  </div>
</body>
</html>

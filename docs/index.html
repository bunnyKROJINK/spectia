<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectia — Minecraft launcher</title>
<meta name="description" content="Spectia — бесплатный лаунчер Minecraft с открытым кодом для своих сборок с модами. A free, open-source Minecraft launcher for your own modpacks.">
<meta property="og:title" content="Spectia — Minecraft launcher">
<meta property="og:description" content="A free, open-source Minecraft launcher for your own modpacks.">
<meta property="og:image" content="https://bunnykrojink.github.io/spectia/shots/en-home.jpg">
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #0B0D1A; --bg2: #111427; --card: #161A2E; --card2: #1C2140; --line: rgba(255,255,255,.09);
    --text: #EEF0FF; --muted: #A9AFD6; --accent: #8B9CFF; --accent2: #6FD3E8; --ink: #0B0D1A;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 "Segoe UI", system-ui, -apple-system, "Noto Sans", "Hiragino Sans", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(900px 600px at 15% -10%, rgba(120,92,255,.28), transparent 60%), radial-gradient(800px 600px at 95% 10%, rgba(40,140,200,.22), transparent 60%); }
  a { color: var(--accent); }
  .wrap { width: min(1160px, calc(100% - 40px)); margin: 0 auto; }

  header { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(14px); background: rgba(11,13,26,.72); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; gap: 22px; height: 64px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; color: var(--text); text-decoration: none; }
  .logo img { width: 32px; height: 32px; border-radius: 8px; image-rendering: auto; }
  nav { display: flex; gap: 18px; margin-left: auto; }
  nav a { color: var(--muted); text-decoration: none; font-size: 15px; }
  nav a:hover { color: var(--text); }
  .lang { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .lang select { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font: inherit; font-size: 14px; cursor: pointer; }
  .gh { display: flex; color: var(--muted); }
  .gh:hover { color: var(--text); }

  .hero { padding: 72px 0 40px; text-align: center; }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: rgba(139,156,255,.1); color: #C9D0FF; font-size: 14px; }
  .badge i { width: 8px; height: 8px; border-radius: 50%; background: #4ED39A; box-shadow: 0 0 10px #4ED39A; }
  h1 { font-size: clamp(34px, 5.4vw, 60px); line-height: 1.08; margin: 22px auto 18px; max-width: 880px; letter-spacing: -.02em; }
  h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--muted); font-size: clamp(16px, 2vw, 19px); max-width: 720px; margin: 0 auto 30px; }
  .cta { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 12px; font-weight: 600; font-size: 17px; text-decoration: none; border: 1px solid var(--line); transition: transform .15s, box-shadow .15s; }
  .btn:hover { transform: translateY(-2px); }
  .btn.primary { background: var(--accent); color: var(--ink); border-color: transparent; box-shadow: 0 6px 0 #5B66C9, 0 14px 40px rgba(139,156,255,.4); }
  .btn.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #5B66C9; }
  .btn.ghost { color: var(--text); background: var(--card); }
  .meta { margin-top: 16px; color: var(--muted); font-size: 14px; min-height: 22px; }

  .frame { margin: 54px auto 0; max-width: 1060px; border-radius: 18px; padding: 10px; background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border: 1px solid var(--line);
    box-shadow: 0 40px 120px rgba(80,70,200,.35), 0 0 0 1px rgba(0,0,0,.4) inset; }
  .frame img { display: block; width: 100%; height: auto; border-radius: 10px; }

  section { padding: 70px 0; }
  h2 { font-size: clamp(26px, 3.4vw, 38px); margin: 0 0 30px; text-align: center; letter-spacing: -.01em; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .feat { padding: 22px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); box-shadow: 0 4px 0 rgba(0,0,0,.35); transition: transform .2s, border-color .2s; }
  .feat:hover { transform: translateY(-3px); border-color: rgba(139,156,255,.4); }
  .feat .ic { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px;
    background: rgba(139,156,255,.14); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(139,156,255,.25); }
  .feat h3 { margin: 0 0 6px; font-size: 18px; }
  .feat p { margin: 0; color: var(--muted); font-size: 15px; }

  .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 22px; }
  .tabs button { font: inherit; font-size: 15px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--ink); border-color: transparent; font-weight: 600; }
  .shot { max-width: 1060px; margin: 0 auto; }
  .shot img { cursor: zoom-in; }

  .faq { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 20px; }
  summary { cursor: pointer; font-weight: 600; font-size: 17px; padding: 14px 0; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--accent); font-size: 22px; line-height: 1; transition: transform .2s; }
  details[open] summary::after { transform: rotate(45deg); }
  details p { margin: 0 0 16px; color: var(--muted); }

  footer { border-top: 1px solid var(--line); padding: 34px 0 44px; color: var(--muted); font-size: 14px; text-align: center; }
  footer p { margin: 4px 0; }

  .lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(4,6,16,.88); display: none; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out; }
  .lightbox.on { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }

  @media (max-width: 980px) { .grid { grid-template-columns: repeat(2, 1fr); } nav { display: none; } .lang { margin-left: auto; } }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } .hero { padding-top: 46px; } .gh { display: none; } header .wrap { gap: 12px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="#top"><img src="icon.png" alt="">Spectia</a>
    <nav>
      <a href="#features" data-t="nav.features"></a>
      <a href="#screens" data-t="nav.screens"></a>
      <a href="#faq" data-t="nav.faq"></a>
    </nav>
    <label class="lang">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      <select id="lang" aria-label="Language"></select>
    </label>
    <a class="gh" href="https://github.com/bunnyKROJINK/spectia" aria-label="GitHub">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.33-1.29-1.69-1.29-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.7 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg>
    </a>
  </div>
</header>

<main id="top">
  <div class="wrap hero">
    <span class="badge"><i></i><span id="ver-badge">Spectia</span></span>
    <h1 id="title"></h1>
    <p class="sub" data-t="hero.sub"></p>
    <div class="cta">
      <a class="btn primary" id="dl" href="https://github.com/bunnyKROJINK/spectia/releases/latest">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
        <span data-t="hero.download"></span>
      </a>
      <a class="btn ghost" href="https://github.com/bunnyKROJINK/spectia" data-t="hero.github"></a>
    </div>
    <div class="meta" id="meta"></div>
    <div class="frame"><img id="hero-img" src="shots/ru-home.jpg" alt="Spectia" width="1920" height="1200"></div>
  </div>

  <section id="features">
    <div class="wrap">
      <h2 data-t="f.title"></h2>
      <div class="grid" id="feats"></div>
    </div>
  </section>

  <section id="screens">
    <div class="wrap">
      <h2 data-t="s.title"></h2>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="frame shot"><img id="shot" src="shots/ru-history.jpg" alt="" width="1920" height="1200"></div>
    </div>
  </section>

  <section id="faq">
    <div class="wrap">
      <h2 data-t="q.title"></h2>
      <div class="faq" id="faqs"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p data-t="foot.license"></p>
    <p data-t="foot.disclaimer"></p>
    <p><a href="https://github.com/bunnyKROJINK/spectia">github.com/bunnyKROJINK/spectia</a></p>
  </div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true"><img alt=""></div>

<script src="i18n.js"></script>
<script>
  const L = window.SITE_I18N;
  const ICONS = [
    '<path d="M12 3 4 7v10l8 4 8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/>',
    '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
    '<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5M12 7v5l3 2"/>',
    '<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
    '<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',
    '<circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1.3"/><circle cx="12" cy="7.5" r="1.3"/><circle cx="15.5" cy="10" r="1.3"/><path d="M12 21c-1.5 0-2-1-2-2s1-2 2.5-2H15a3 3 0 0 0 3-3"/>',
    '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
    '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  ];
  const SHOTS = ['home', 'history', 'downloads', 'theme', 'music', 'book', 'tour'];
  let lang = 'ru';
  let shot = 'history';
  let release = null;

  function pickLang() {
    try { const saved = localStorage.getItem('spectia-site-lang'); if (saved && L[saved]) return saved; } catch {}
    const q = new URLSearchParams(location.search).get('lang');
    if (q && L[q]) return q;
    for (const l of navigator.languages || [navigator.language]) {
      const c = String(l || '').toLowerCase().split('-')[0];
      if (L[c]) return c;
    }
    return 'en';
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const t = (k) => L[lang][k] ?? L.en[k] ?? k;

  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
    const title = t('hero.title');
    // Последние слова заголовка подсвечиваем градиентом
    const words = title.split(' ');
    const cut = Math.max(1, words.length - (lang === 'zh' || lang === 'ja' ? 0 : 3));
    document.getElementById('title').innerHTML = words.length > 3
      ? esc(words.slice(0, cut).join(' ')) + ' <span>' + esc(words.slice(cut).join(' ')) + '</span>'
      : '<span>' + esc(title) + '</span>';
    document.getElementById('feats').innerHTML = ICONS.map((ic, i) => `
      <article class="feat">
        <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic}</svg></div>
        <h3>${esc(t('f' + (i + 1) + '.t'))}</h3><p>${esc(t('f' + (i + 1) + '.d'))}</p>
      </article>`).join('');
    document.getElementById('tabs').innerHTML = SHOTS.map((s) => `<button role="tab" aria-selected="${s === shot}" data-shot="${s}">${esc(t('s.' + s))}</button>`).join('');
    document.getElementById('faqs').innerHTML = [1, 2, 3, 4, 5].map((n) => `<details><summary>${esc(t('q' + n + '.q'))}</summary><p>${esc(t('q' + n + '.a'))}</p></details>`).join('');
    const set = L[lang].shots;
    document.getElementById('hero-img').src = `shots/${set}-home.jpg`;
    const img = document.getElementById('shot'); img.src = `shots/${set}-${shot}.jpg`; img.alt = t('s.' + shot);
    renderMeta();
  }

  function renderMeta() {
    const meta = document.getElementById('meta');
    if (release) {
      meta.textContent = t('hero.meta').replace('{v}', release.version).replace('{size}', release.size);
      document.getElementById('ver-badge').textContent = 'Spectia ' + release.version;
    } else {
      meta.textContent = t('hero.metaLoading');
    }
  }

  const sel = document.getElementById('lang');
  sel.innerHTML = Object.entries(L).map(([c, d]) => `<option value="${c}">${esc(d.name)}</option>`).join('');
  lang = pickLang(); sel.value = lang;
  sel.addEventListener('change', () => { lang = sel.value; try { localStorage.setItem('spectia-site-lang', lang); } catch {} render(); });
  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-shot]'); if (!b) return;
    shot = b.dataset.shot; render();
  });
  const box = document.getElementById('lightbox');
  document.getElementById('shot').addEventListener('click', (e) => { box.querySelector('img').src = e.target.src; box.classList.add('on'); });
  box.addEventListener('click', () => box.classList.remove('on'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') box.classList.remove('on'); });
  render();

  // Прямая ссылка на установщик из последнего релиза
  fetch('https://api.github.com/repos/bunnyKROJINK/spectia/releases/latest')
    .then((r) => (r.ok ? r.json() : null))
    .then((r) => {
      if (!r) return;
      const exe = (r.assets || []).find((a) => /setup\.exe$/i.test(a.name));
      if (exe) document.getElementById('dl').href = exe.browser_download_url;
      release = { version: String(r.tag_name || '').replace(/^v/, ''), size: exe ? (exe.size / 1048576).toFixed(1) + ' MB' : '' };
      if (!release.size) release.size = 'Windows';
      renderMeta();
    })
    .catch(() => {});
</script>
</body>
</html>

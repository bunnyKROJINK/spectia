[package]
name = "spectia"
version = "0.1.0"
description = "Spectia — красивый лаунчер для Minecraft"
authors = ["bunnyKROJINK"]
license = "GPL-3.0-only"
repository = "https://github.com/bunnyKROJINK/spectia"
edition = "2021"
rust-version = "1.77"

[lib]
name = "spectia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
# Делаем установщик маленьким и быстрым
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
